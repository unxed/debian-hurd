name: run-hurd-poc

on:
  workflow_dispatch:
    inputs:
      mkhurd:
        description: 'Also run poc/mkhurd.sh (regenerate zerrors/ztypes, symbol probe)'
        type: boolean
        default: false
      loops:
        description: 'Run poc/loop_tests.sh (flakiness statistics)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble image
        run: |
          cat hurd-image-parts/part_* > image.tar.gz
          tar xzf image.tar.gz
          ls -lh *.img

      - name: Inject PoC sources and patch grub for serial console + rw root
        run: |
          IMG=$(ls *.img)
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          sudo losetup -fP "$IMG"
          LOOPDEV=$(losetup -j "$IMG" | cut -d: -f1)
          mkdir -p /tmp/hurdroot
          sudo mount "${LOOPDEV}p2" /tmp/hurdroot

          sudo mkdir -p /tmp/hurdroot/root/poc
          sudo cp poc/futex_poc.c poc/sig_poc.c poc/io_poc.c poc/segv_poc.c poc/abi_probe.c poc/ctx_poc.c poc/pty_poc.c poc/mkhurd.sh poc/mkztypes_hurd.c poc/loop_tests.sh poc/Makefile /tmp/hurdroot/root/poc/
          sudo cp poc/hurdhello.bin /tmp/hurdroot/root/poc/hurdhello.bin
          sudo chmod +x /tmp/hurdroot/root/poc/hurdhello.bin
          if [ -f poc/f4/f4.gz ]; then
            sudo mkdir -p /tmp/hurdroot/root/f4
            sudo cp poc/f4/f4.gz /tmp/hurdroot/root/f4/f4.gz
          fi
          if ls poc/gotests/*.bin >/dev/null 2>&1; then
            sudo mkdir -p /tmp/hurdroot/root/gotests
            sudo cp poc/gotests/*.bin /tmp/hurdroot/root/gotests/
            sudo sh -c 'chmod +x /tmp/hurdroot/root/gotests/*.bin'
          fi

          echo "=== searching headers for gsync ==="
          sudo grep -rn "gsync" /tmp/hurdroot/usr/include 2>/dev/null || echo "(no gsync hits)"
          echo "=== searching headers for semaphore ==="
          sudo grep -rln "semaphore" /tmp/hurdroot/usr/include 2>/dev/null || echo "(no semaphore hits)"
          echo "=== gnumach.h gsync declarations ==="
          sudo sed -n '55,115p' /tmp/hurdroot/usr/include/mach/gnumach.h
          echo "=== gnumach.defs gsync doc/flags ==="
          sudo sed -n '80,140p' /tmp/hurdroot/usr/include/x86_64-gnu/mach/gnumach.defs
          echo "=== GSYNC_ flag defines ==="
          sudo grep -rn "GSYNC_" /tmp/hurdroot/usr/include/ 2>/dev/null || echo "(no GSYNC_ defines found; using flags=0)"

          sudo cp /tmp/hurdroot/boot/grub/grub.cfg /tmp/grub.cfg.orig
          sudo chmod 644 /tmp/grub.cfg.orig
          sed \
            -e '1i serial --unit=0 --speed=115200\nterminal_input --append serial\nterminal_output --append serial' \
            -e 's/ext2fs --readonly/ext2fs/' \
            -e 's/root=part:2:device:wd0/root=part:2:device:wd0 console=com0/' \
            /tmp/grub.cfg.orig > /tmp/grub.cfg.new
          diff -u /tmp/grub.cfg.orig /tmp/grub.cfg.new || true
          sudo cp /tmp/grub.cfg.new /tmp/hurdroot/boot/grub/grub.cfg

          sync
          sudo umount /tmp/hurdroot
          sudo losetup -d "$LOOPDEV"

      - name: Install QEMU and pexpect
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 python3-pexpect

      - name: Enable KVM (if the runner offers it)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm"

      - name: Boot Hurd under QEMU and run PoC over serial console
        run: |
          set +e
          python3 .github/scripts/run_poc.py "$IMG" 2>&1 | tee /tmp/poc-transcript.log
          echo "run_poc.py exit status: ${PIPESTATUS[0]}"
        shell: bash
        env:
          RUN_MKHURD: ${{ inputs.mkhurd && '1' || '0' }}
          RUN_LOOPS: ${{ inputs.loops && '1' || '0' }}

      - name: Summarize PoC results
        if: always()
        run: |
          echo "### futex_poc / sig_poc results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "RESULT:|RC_[0-9]" /tmp/poc-transcript.log >> "$GITHUB_STEP_SUMMARY" || echo "(no RESULT lines found)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Decode generated files from transcript
        if: always()
        run: |
          python3 - <<'PYEOF'
          import base64, os, re
          if not os.path.exists('/tmp/poc-transcript.log'):
              raise SystemExit('no transcript')
          t = open('/tmp/poc-transcript.log', errors='replace').read().replace('\r', '')
          os.makedirs('/tmp/hurd-gen', exist_ok=True)
          n = 0
          for m in re.finditer(r'@@@BEGIN (\S+?)@@@\n(.*?)@@@END \1@@@', t, re.S):
              b = re.sub(r'[^A-Za-z0-9+/=]', '', m.group(2))
              open('/tmp/hurd-gen/' + m.group(1), 'wb').write(base64.b64decode(b))
              n += 1
          print('decoded', n, 'files')
          PYEOF
          ls -l /tmp/hurd-gen || true

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hurd-generated
          path: /tmp/hurd-gen
          if-no-files-found: warn
          retention-days: 14

      - name: Upload full transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hurd-poc-transcript
          path: /tmp/poc-transcript.log
          retention-days: 7
