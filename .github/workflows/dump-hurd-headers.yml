name: dump-hurd-headers

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble image
        run: |
          cat hurd-image-parts/part_* > image.tar.gz
          tar xzf image.tar.gz

      - name: Loop-mount read-only and dump headers
        run: |
          IMG=$(ls *.img)
          sudo losetup -fP "$IMG"
          LOOPDEV=$(losetup -j "$IMG" | cut -d: -f1)
          mkdir -p /tmp/hurdroot
          sudo mount -o ro "${LOOPDEV}p2" /tmp/hurdroot
          R=/tmp/hurdroot

          echo "### libc soname / NEEDED entries ==="
          sudo ls -la $R/lib/x86_64-gnu/ 2>/dev/null | grep -i libc
          sudo readelf -d $R/bin/ls 2>/dev/null | grep -i NEEDED

          for f in \
            usr/include/x86_64-gnu/bits/signum-generic.h \
            usr/include/x86_64-gnu/bits/signum-arch.h \
            usr/include/x86_64-gnu/bits/errno.h \
            usr/include/x86_64-gnu/bits/local_lim.h \
            usr/include/x86_64-gnu/bits/mman.h \
            usr/include/x86_64-gnu/bits/mman-linux.h \
            usr/include/x86_64-gnu/bits/fcntl.h \
            usr/include/x86_64-gnu/bits/sigaction.h \
            usr/include/x86_64-gnu/bits/sigcontext.h \
            usr/include/x86_64-gnu/sys/ucontext.h \
            usr/include/x86_64-gnu/bits/sigstack.h \
            usr/include/x86_64-gnu/bits/pthreadtypes.h \
            usr/include/x86_64-gnu/bits/semaphore.h \
            usr/include/x86_64-gnu/bits/stat.h \
            usr/include/x86_64-gnu/bits/struct_stat.h \
            usr/include/hurd/signal.h \
            usr/include/mach/i386/mach_i386.defs \
          ; do
            echo "=== $f ==="
            sudo cat "$R/$f" 2>/dev/null || echo "(missing)"
            echo
          done

          echo "=== find sigcontext / mcontext / ucontext headers anywhere ==="
          sudo find $R/usr/include -iname '*sigcontext*' -o -iname '*ucontext*' -o -iname '*mcontext*' 2>/dev/null

          echo "=== find signum / errno headers anywhere ==="
          sudo find $R/usr/include -iname '*signum*' -o -iname 'errno*.h' 2>/dev/null

      - name: Cleanup
        if: always()
        run: |
          sudo umount /tmp/hurdroot || true
