name: find-pthread-lib

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble image
        run: |
          cat hurd-image-parts/part_* > image.tar.gz
          tar xzf image.tar.gz

      - name: Loop-mount read-only and search for pthread_create
        run: |
          IMG=$(ls *.img)
          sudo losetup -fP "$IMG"
          LOOPDEV=$(losetup -j "$IMG" | cut -d: -f1)
          mkdir -p /tmp/hurdroot
          sudo mount -o ro "${LOOPDEV}p2" /tmp/hurdroot
          R=/tmp/hurdroot

          echo "=== all libpthread* files ==="
          sudo find $R -iname 'libpthread*' 2>/dev/null

          echo "=== all lib*.so* in /lib/x86_64-gnu ==="
          sudo ls -la $R/lib/x86_64-gnu/ 2>/dev/null | grep -E '\.so'

          echo "=== which lib exports pthread_create (searching common candidates) ==="
          for lib in $R/lib/x86_64-gnu/libc.so.0.3 $R/lib/x86_64-gnu/libpthread.so.0.3 $R/lib/x86_64-gnu/libpthread.so; do
            if sudo test -f "$lib"; then
              echo "--- $lib ---"
              sudo nm -D "$lib" 2>/dev/null | grep -w "pthread_create\|pthread_attr_init\|pthread_kill\|sem_init\|sem_wait" || echo "(nm found nothing / not found)"
            fi
          done

          echo "=== objdump -T fallback on libc.so.0.3 for pthread_create ==="
          sudo objdump -T $R/lib/x86_64-gnu/libc.so.0.3 2>/dev/null | grep -i pthread_create || echo "(not in libc.so.0.3)"

          echo "=== what does a real threaded binary link against? (sshd uses threads) ==="
          sudo readelf -d $R/usr/sbin/sshd 2>/dev/null | grep NEEDED

      - name: Cleanup
        if: always()
        run: |
          sudo umount /tmp/hurdroot || true
